<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ───────────── TOP BAR ───────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <!-- Custom name greeting -->
      <div id="greeting" class="greeting"></div>
      <div id="datetime" class="datetime"></div>
    </div>
    <div class="topbar-right">
      <button id="btn-name" class="icon-btn" title="Set your name">✏️</button>
      <button id="btn-theme" class="icon-btn" title="Toggle dark/light mode">🌙</button>
    </div>
  </header>

  <!-- ───────────── MAIN GRID ───────────── -->
  <main class="dashboard">

    <!-- ── FOCUS TIMER ── -->
    <section class="card" id="timer-card">
      <h2 class="card-title">Focus Timer</h2>

      <div class="timer-display" id="timer-display">25:00</div>

      <div class="timer-controls">
        <button id="btn-start" class="btn btn-primary">Start</button>
        <button id="btn-stop"  class="btn btn-secondary">Stop</button>
        <button id="btn-reset" class="btn btn-ghost">Reset</button>
      </div>

      <!-- Change pomodoro time (Challenge) -->
      <div class="timer-settings">
        <label for="pomodoro-minutes">Set minutes:</label>
        <input id="pomodoro-minutes" type="number" min="1" max="120" value="25" />
        <button id="btn-set-time" class="btn btn-ghost btn-sm">Set</button>
      </div>
    </section>

    <!-- ── TO-DO LIST ── -->
    <section class="card" id="todo-card">
      <div class="card-header">
        <h2 class="card-title">To-Do List</h2>
        <select id="sort-select" class="sort-select">
          <option value="default">Sort: Default</option>
          <option value="az">Sort: A → Z</option>
          <option value="za">Sort: Z → A</option>
          <option value="done">Sort: Done Last</option>
        </select>
      </div>

      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task…"
          autocomplete="off"
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>

      <p id="todo-empty" class="empty-msg">No tasks yet. Add one above!</p>
    </section>

    <!-- ── QUICK LINKS ── -->
    <section class="card" id="links-card">
      <h2 class="card-title">Quick Links</h2>

      <form id="link-form" class="link-form">
        <input id="link-name" type="text"  placeholder="Name (e.g. YouTube)" />
        <input id="link-url"  type="url"   placeholder="URL (https://…)"     />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <div id="links-grid" class="links-grid"></div>

      <p id="links-empty" class="empty-msg">No links yet. Add one above!</p>
    </section>

  </main>

  <!-- ───────────── NAME MODAL ───────────── -->
  <div id="name-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h3 id="modal-title">What's your name?</h3>
      <input id="name-input" type="text" placeholder="Enter your name…" maxlength="40" />
      <div class="modal-actions">
        <button id="modal-save" class="btn btn-primary">Save</button>
        <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
